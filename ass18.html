<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #003399;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        main {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        caption {
            font-weight: bold;
            margin-bottom: 8px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e9e9e9;
            text-align: center;
        }
        fieldset {
            border: 1px solid #999;
            padding: 15px;
        }
        legend {
            padding: 0 5px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 300px;
            padding: 5px;
            border: 1px solid #777;
        }
        select {
            padding: 5px;
        }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 70px;
        }
        button {
            padding: 6px 15px;
            cursor: pointer;
        }
        footer {
            background-color: #003399;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 0.9em;
            margin-top: 20px;
        }
        .container {
            border: 2px solid #a3c293;
            padding: 20px 150px;
        }   
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>
                    
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course:</label>
                        <select id="course" name="course" required>
                            <option value="btech-cse">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="statement">Statement:</label>
                        <textarea id="statement" name="statement" required></textarea>
                    </div>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</div>
</body>
</html>
